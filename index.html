<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boerderij van Timo 🚜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --grass:#8bc34a; --grass-dark:#6fa835; --grass-stripe:#7fbb3f;
    --wood:#8b5a2b; --wood-dark:#6e4520;
    --barn-red:#c1443c; --barn-red-dark:#932e28; --roof-dark:#5a3a22;
    --coop-tan:#d9a35c; --shed-blue:#5b8aa6; --shed-blue-dark:#3f6579;
    --sun:#ffc93c; --cream:#fff8e8; --shadow:rgba(0,0,0,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; min-height:100%; font-family:'Baloo 2', sans-serif;
    overflow-x:hidden; user-select:none; touch-action: manipulation;
    transition:background 4s ease;
  }
  body.phase-day{ background:#d7f0b8; }
  body.phase-sunset{ background:#d7f0b8; }
  body.phase-night{ background:#37502f; }
  body.phase-dawn{ background:#d7f0b8; }

  .hero{ position:relative; overflow:hidden; transition:background 4s ease;
    display:flex; flex-direction:column; min-height:300px;
    width:100vw; left:50%; margin-left:-50vw; }
  .hero-inner{ width:100%; max-width:900px; margin:0 auto; flex:1; display:flex; flex-direction:column; position:relative; z-index:2; }
  body.phase-day .hero{    background:linear-gradient(#8fd3f4, #c9ecff); }
  body.phase-sunset .hero{ background:linear-gradient(#f6a26b, #ffd39a); }
  body.phase-night .hero{  background:linear-gradient(#1a2340, #2f3b66); }
  body.phase-dawn .hero{   background:linear-gradient(#c3d4f0, #ffe3c2); }

  #app{ max-width:900px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }
  .hills{ position:absolute; left:0; right:0; bottom:-10px; height:220px; background-size:cover;
    background-position:bottom; background-repeat:no-repeat; z-index:1; filter:brightness(1) saturate(1); transition:filter 4s ease; }
  body.phase-day .hills{    filter:brightness(1) saturate(1); }
  body.phase-sunset .hills{ filter:brightness(0.85) saturate(1.1); }
  body.phase-night .hills{  filter:brightness(0.4) saturate(0.75) hue-rotate(-8deg); }
  body.phase-dawn .hills{   filter:brightness(0.9) saturate(1); }
  .stars{ position:absolute; top:0; left:0; right:0; height:170px; z-index:0; opacity:0; transition:opacity 3s ease; pointer-events:none; }
  body.phase-night .stars{ opacity:1; }
  .star{ position:absolute; width:3px; height:3px; background:#fff; border-radius:50%; opacity:0.85; }

  header{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 4px; position:relative; z-index:5; gap:10px; }
  .title-wrap{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .title-row{ display:flex; align-items:center; gap:6px; }
  .day-counter{ font-size:0.78rem; font-weight:700; color:#5a3d1f; opacity:0.85; padding-left:4px; }
  .level-goal{ font-size:0.68rem; font-weight:700; color:#4a6b1f; opacity:0.85; padding-left:4px; }
  .progress-frame{ width:110px; height:30px; background:#c98f4e; border:3px solid #8a5a2b; border-radius:999px;
    position:relative; margin:3px 0 0 2px; overflow:hidden; }
  .progress-fill{ position:absolute; top:3px; bottom:3px; left:3px; background:linear-gradient(#ffe27a,#f0c34d);
    border-radius:999px; transition:width 0.6s ease; }
  .title{ font-weight:800; font-size:1.35rem; color:#5a3d1f; text-shadow:0 2px 0 #fff8; outline:none;
    border-bottom:2px dashed transparent; padding:2px 4px; max-width:100%; overflow-wrap:break-word; }
  .title:focus{ border-bottom:2px dashed #c1443c; background:#fff6; border-radius:6px; }
  .edit-pencil{ font-size:1rem; opacity:0.6; cursor:pointer; flex-shrink:0; }
  .sun, .moon{ position:absolute; top:-30px; right:20px; width:90px; height:90px; border-radius:50%; transition:opacity 2s ease; }
  .sun{ background:radial-gradient(circle, #ffe17d, var(--sun)); box-shadow:0 0 30px 10px #ffdd7688; animation:sunpulse 4s ease-in-out infinite; opacity:1; }
  .moon{ background-size:contain; background-repeat:no-repeat; background-position:center; opacity:0; }
  body.phase-night .sun{ opacity:0; }
  body.phase-night .moon{ opacity:1; }
  @keyframes sunpulse{ 50%{ transform:scale(1.06);} }
  .coins{ background:var(--cream); border:2px solid #f0c34d; border-radius:999px; padding:4px 10px;
    font-weight:800; font-size:1.2rem; color:#8a5a00; box-shadow:0 3px 0 var(--shadow);
    display:flex; align-items:center; gap:5px; z-index:6; flex-shrink:0; align-self:flex-start; margin:6px 0 0 2px; }
  .coins span.icon{font-size:1.4rem;}
  .cloud{ position:absolute; opacity:0.9; transition:opacity 3s ease; }
  body.phase-night .cloud{ opacity:0.25; }

  .menu-banner-wrap{ padding:0 6px 0; margin-top:auto; position:relative; z-index:2; display:flex; align-items:flex-end; gap:2px; }
  .menu-banner{ flex:1; min-width:0; background-size:contain; background-repeat:no-repeat; background-position:center;
    min-height:60px; display:flex; align-items:center; justify-content:center; gap:8px; padding:8px 16px; }
  .menu-banner .title{ font-weight:800; font-size:1.35rem; color:#5a3d1f; text-shadow:0 2px 0 #fff8; outline:none;
    border-bottom:2px dashed transparent; padding:2px 4px; text-align:center; }
  .menu-banner .title:focus{ border-bottom:2px dashed #c1443c; background:#fff6; border-radius:6px; }

  .fields-wrap{ padding:10px 0 6px; position:relative; z-index:2; transition:background 4s ease; }
  body.phase-day .fields-wrap{    background:#d7f0b8; }
  body.phase-sunset .fields-wrap{ background:#d7f0b8; }
  body.phase-night .fields-wrap{  background:#37502f; }
  body.phase-dawn .fields-wrap{   background:#d7f0b8; }
  .section-label{ font-weight:800; color:#4a6b1f; font-size:1.05rem; margin:6px 4px 6px 20px; text-shadow:0 1px 0 #fff6; transition:color 4s ease; }
  body.phase-night .section-label{ color:#cfe8a8; text-shadow:0 1px 2px #0006; }
  .fields{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; padding:0 16px 14px; position:relative; overflow:hidden; }
  .field{ position:relative; background:#a9743a; overflow:hidden;
    background-image:repeating-linear-gradient(90deg, #9c6a35 0 8px, #a9743a 8px 16px);
    border-radius:16px; height:112px;
    cursor:pointer; border:4px solid #7a5228; transition:transform .15s; }
  .field-soil{ position:absolute; inset:0; background-size:135% 135%; background-position:center;
    background-repeat:no-repeat; transition:opacity .4s ease; }
  .field-content{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    transition:opacity .3s ease; }
  .field-busy{ position:absolute; inset:0; }
  .field:active{ transform:scale(0.96); }
  .field.stage-fertilized .field-content{ /* keep the fertilized tint on the content layer, above the soil */ box-shadow:inset 0 0 0 100px rgba(140,210,90,0.14); }
  .field.locked{ background:#8a7256; background-image:none; }
  .field .lock{ color:#fff; text-align:center; font-weight:800; }
  .field .lock .lockicon{ font-size:1.9rem; display:block; }
  .field .lock small{ font-size:0.8rem; opacity:0.9; }
  .field .crop{ font-size:2.4rem; transition:transform .3s; filter:drop-shadow(0 3px 2px #0003); display:block; }
  .field.ready .crop{ animation:bounce 0.7s ease-in-out infinite; }
  @keyframes bounce{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-10px) scale(1.08); } }
  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,201,60,0); }
    50%{ box-shadow:0 0 16px 5px rgba(255,201,60,0.85); }
  }
  .affordable-glow{ animation:glowPulse 1.3s ease-in-out infinite; border-color:#ffc93c !important; }
  .field-caption{ position:absolute; bottom:6px; left:0; right:0; text-align:center; font-size:0.72rem;
    font-weight:800; color:#fff; text-shadow:0 1px 2px #0009; z-index:21; pointer-events:none; }
  .field .plusone{ position:absolute; top:6px; font-weight:800; color:#ffde59; font-size:1.2rem;
    text-shadow:0 2px 2px #0006; animation:floatup 0.9s forwards; pointer-events:none; }
  .heart-pop{ position:absolute; bottom:52px; font-size:1.3rem; pointer-events:none; z-index:6;
    animation:floatup 0.9s forwards; }
  @keyframes floatup{ 0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-40px);} }
  .tractor{ position:absolute; top:42%; left:-15%; transform:translateY(-50%); font-size:2.5rem;
    z-index:20; animation:drive linear forwards; filter:drop-shadow(0 3px 2px #0004); }
  .tractor-img{ width:66px; height:auto; display:block; transform:scaleX(-1); }
  .harvester-img{ width:100px; }
  .compost-img{ width:92px; transform:none; }
  .field-icon-img{ width:66px; height:auto; vertical-align:middle; filter:drop-shadow(0 2px 2px #0004); }
  .field-crop-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .tool-icon-img{ width:28px; height:auto; display:block; margin:0 auto; }
  .inline-icon-img{ width:1.35em; height:auto; vertical-align:middle; display:inline-block; }
  @keyframes drive{ 0%{ left:-15%; } 100%{ left:115%; } }

  .farmyard-wrap{ padding:10px 16px; position:relative; z-index:2;}
  .farmyard{ display:flex; gap:10px; align-items:flex-end; margin-top:16px; }
  .barn{ flex:0 0 92px; height:150px; border-radius:4px 4px 6px 6px; border:none;
    background-size:contain; background-repeat:no-repeat; background-position:bottom;
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    cursor:pointer; color:#fff; font-weight:800; padding:8px 4px; text-align:center;
    transition:transform .15s; margin-right:-18px; z-index:4; }
  .barn:active{ transform:scale(0.96); }
  .barn .door{ display:none; }
  .barn small{ font-size:0.78rem; opacity:0.95; text-shadow:0 1px 3px #000, 0 1px 3px #000; }

  .pasture-frame{ flex:1; position:relative; }
  .fence-strip{ position:absolute; left:0; right:0; height:26px;
    background-image:url('images/fence.png'); background-repeat:repeat-x; background-size:auto 30px;
    background-position:bottom; pointer-events:none; z-index:3; }
  .fence-strip.fence-top{ top:-17px; }
  .fence-strip.fence-bottom{ bottom:-6px; }
  .pasture{ width:100%; background:#a9d96c; border:4px solid var(--wood-dark);
    border-radius:0; min-height:104px; position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:6px; }
  .pasture .empty-msg{ margin:auto; color:#4a6b1fbb; font-weight:700; font-size:0.9rem; text-align:center; }
  .animal{ position:absolute; bottom:8px; font-size:2.1rem; filter:drop-shadow(0 3px 2px #0003);
    animation-name:wander; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
    opacity:1; transition:opacity 2s ease; }
  .animal img.inline-icon-img{ width:48px; transform:scaleX(-1); }
  body.phase-night .animal{ opacity:0; }
  @keyframes wander{
    0%{ transform:translateX(0) scaleX(-1); } 45%{ transform:translateX(var(--w, 60px)) scaleX(-1); }
    50%{ transform:translateX(var(--w, 60px)) scaleX(1); } 95%{ transform:translateX(0) scaleX(1); } 100%{ transform:translateX(0) scaleX(-1); }
  }
  .product{ position:absolute; font-size:1.9rem; cursor:pointer; animation:pop 0.3s ease-out; filter:drop-shadow(0 2px 2px #0003); z-index:5; }
  @keyframes pop{ 0%{ transform:scale(0);} 100%{ transform:scale(1);} }

  .coop-wrap{ padding:10px 16px; position:relative; z-index:2;}
  .coop-row{ display:flex; gap:10px; align-items:flex-end; margin-top:16px; }
  .coop{ flex:0 0 92px; height:150px; border-radius:4px 4px 6px 6px; border:none;
    background-size:contain; background-repeat:no-repeat; background-position:bottom;
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    cursor:pointer; color:#5a3d1f; font-weight:800; padding:8px 4px; text-align:center;
    transition:transform .15s; margin-right:-18px; z-index:4; }
  .coop:active{ transform:scale(0.96); }
  .coop small{ font-size:0.78rem; text-shadow:0 1px 3px #fff, 0 1px 3px #fff; }
  .chicken-yard{ width:100%; background:#e4cf9a; border:4px solid var(--wood-dark);
    border-radius:0; min-height:94px; position:relative; overflow:hidden; display:flex; align-items:flex-end; padding:6px; }
  .chicken-yard .empty-msg{ margin:auto; color:#8a6b3fbb; font-weight:700; font-size:0.9rem; text-align:center; }
  .chicken{ position:absolute; bottom:8px; font-size:1.9rem; filter:drop-shadow(0 2px 2px #0003);
    animation-name:wander; animation-timing-function:ease-in-out; animation-iteration-count:infinite; cursor:default;
    opacity:1; transition:opacity 2s ease; }
  body.phase-night .chicken{ opacity:0; }

  .shed-wrap{ padding:10px 16px; position:relative; z-index:2; }
  .shed{ width:150px; height:190px; margin:14px auto 0; border-radius:4px 4px 6px 6px; border:none;
    background-size:contain; background-repeat:no-repeat; background-position:bottom;
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:8px 4px; text-align:center; color:#fff; font-weight:800; z-index:1; }
  .shed small{ font-size:0.78rem; text-shadow:0 1px 3px #000, 0 1px 3px #000; }
  .tools{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; position:relative; z-index:2; margin-top:-38px; }
  .tool-card{ background:#fff; border:3px solid #e5d3a8; border-radius:14px; padding:10px 4px; text-align:center;
    font-weight:700; color:#5a3d1f; cursor:pointer; min-height:108px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; }
  .tool-card:active{ transform:scale(0.96); }
  .tool-card .em{ font-size:1.7rem; display:block; }
  .tool-card .price{ font-size:0.8rem; color:#8a5a00; }
  .tool-card .desc{ font-size:0.66rem; font-weight:600; color:#8a6b4a; }
  .tool-card.owned{ background:#e4f5d6; border-color:#8fbf5a; cursor:default; }
  .tool-card.owned .price{ color:#4a6b1f; }
  .tool-card.disabled{ opacity:0.5; }

  .stock-wrap{ flex:1; min-width:0; }
  .stock-table{ background:var(--cream); border:3px solid #e5d3a8; border-radius:16px; padding:10px 16px; }
  .stock-row{ display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-weight:700; color:#5a3d1f; font-size:0.98rem; }
  .stock-row + .stock-row{ border-top:1px dashed #e5d3a8; }
  .stock-row .em{ font-size:1.3rem; margin-right:8px; }
  .stock-empty{ text-align:center; color:#8a6b4a; font-weight:600; padding:6px 0; }
  .stock-shop-row{ display:flex; gap:12px; align-items:stretch; padding:10px 16px 28px; position:relative; z-index:2; }
  .shop-wrap{ flex:0 0 168px; }
  .shop-img-btn{ width:100%; height:100%; min-height:160px; border:none; background-color:transparent;
    background-image:url('images/shop.png'); background-size:contain; background-repeat:no-repeat; background-position:center;
    cursor:pointer; padding:0; }
  .shop-img-btn:active{ transform:scale(0.96); }
  .reset-wrap{ padding:0 16px 20px; text-align:center; position:relative; z-index:2; }
  .reset-btn{ background:none; border:none; color:#8a6b4a; opacity:0.65; font-family:inherit;
    font-size:0.8rem; font-weight:700; cursor:pointer; padding:6px 10px; text-decoration:underline; }
  .reset-btn:active{ opacity:1; }

  .overlay{ position:fixed; inset:0; background:rgba(30,20,10,0.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .overlay.show{ display:flex; }
  .modal{ background:var(--cream); border-radius:24px; border:5px solid #f0c34d; padding:0; position:relative;
    max-width:420px; width:100%; box-shadow:0 10px 0 var(--shadow); }
  .modal-scroll{ padding:20px; max-height:80vh; overflow-y:auto; border-radius:19px; }
  .modal-close-x{ position:absolute; top:-16px; right:-16px; width:38px; height:38px; border-radius:50%;
    background:none; border:none; padding:0; cursor:pointer; z-index:10; filter:drop-shadow(0 3px 2px #0005); }
  .modal-close-x:active{ transform:translateY(2px); }
  .modal h2{ margin:0 0 12px; color:#5a3d1f; font-size:1.3rem; text-align:center; }
  .modal-subheading{ font-weight:800; color:#5a3d1f; font-size:0.92rem; margin:2px 0 8px; }
  .grid-choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choice{ background:#fff; border:3px solid #e5d3a8; border-radius:16px; padding:12px 6px; text-align:center;
    cursor:pointer; font-weight:700; color:#5a3d1f; }
  .choice:active{ transform:scale(0.95); }
  .choice .em{ font-size:2.1rem; display:block; margin-bottom:4px;}
  .choice .price{ color:#8a5a00; font-size:0.88rem; margin-top:2px; }
  .choice .price.sell{ color:#4a6b1f; }
  .choice.disabled{ opacity:0.4; }
  .choice.locked .em{ opacity:0.5; }
  .choice.locked .price{ color:#a55; }
  .close-btn{ display:block; margin:16px auto 0; background:#e5d3a8; border:none; border-radius:999px;
    padding:10px 26px; font-weight:800; font-family:inherit; font-size:1.02rem; color:#5a3d1f; cursor:pointer; }
  .sell-row{ display:flex; align-items:center; justify-content:space-between; background:#fff;
    border:3px solid #e5d3a8; border-radius:14px; padding:10px 14px; margin-bottom:10px; }
  .sell-row .left{ display:flex; align-items:center; gap:10px; font-weight:700; color:#5a3d1f;}
  .sell-row .left .em{ font-size:1.7rem; }
  .sell-btn{ background:var(--grass-dark); color:#fff; border:none; border-radius:999px;
    padding:8px 16px; font-weight:800; font-family:inherit; cursor:pointer; }
  .empty-shop{ text-align:center; color:#8a6b4a; font-weight:600; padding:10px 0 4px; }

  .rain{ position:fixed; inset:0; pointer-events:none; z-index:50; opacity:0; transition:opacity 1s ease; }
  .rain.active{ opacity:1; }
  .drop{ position:absolute; top:-20px; width:2px; height:16px; background:#7fb8e8; opacity:0.7; animation:fall linear infinite; }
  @keyframes fall{ to{ transform:translateY(110vh); } }

  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:200; }
  .confetti-piece{ position:absolute; top:-20px; width:10px; height:10px; animation:confettifall 2.2s linear forwards; }
  @keyframes confettifall{ to{ transform:translateY(110vh) rotate(400deg); } }
  .milestone-toast{ position:fixed; top:20%; left:50%; transform:translate(-50%,-20px); background:var(--cream);
    border:4px solid #f0c34d; border-radius:20px; padding:16px 24px; font-weight:800; color:#5a3d1f; font-size:1.15rem;
    text-align:center; z-index:201; box-shadow:0 8px 0 var(--shadow); opacity:0; transition:opacity .4s ease, transform .4s ease; }
  .milestone-toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body class="phase-day">
<div class="rain" id="rain"></div>
<div id="app">
  <div class="hero" id="hero">
    <div class="hills"></div>
    <div class="stars" id="stars"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="hero-inner">
      <header>
        <div class="title-wrap">
          <div class="day-counter" id="dayCounter">📅 Dag 1 · ⭐ Niveau 1</div>
          <div class="level-goal" id="levelGoal"></div>
          <div class="progress-frame" id="progressFrame"><div class="progress-fill" id="progressFill"></div></div>
          <div class="coins"><span class="icon"><img class="inline-icon-img" src="images/coin.png" alt="munten" style="width:1.4rem;" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🪙'}))"></span><span id="coinCount">8</span></div>
        </div>
      </header>

      <div class="menu-banner-wrap">
        <div class="menu-banner" id="menuBanner">
          <div class="title" id="farmTitle" contenteditable="true" spellcheck="false">Boerderij van Timo 🚜</div>
          <span class="edit-pencil">✏️</span>
        </div>
      </div>
    </div>
  </div>

  <div class="fields-wrap">
    <div class="section-label">🌾 De akker</div>
    <div class="fields" id="fields"></div>
  </div>

  <div class="farmyard-wrap">
    <div class="section-label">🐾 De wei en de schuren</div>
    <div class="farmyard">
      <div class="barn" id="barn0"><div class="door"></div></div>
      <div class="pasture-frame"><div class="fence-strip fence-top"></div><div class="pasture" id="pasture"><div class="empty-msg">Nog geen dieren!</div></div><div class="fence-strip fence-bottom"></div></div>
    </div>
  </div>

  <div class="coop-wrap">
    <div class="section-label">🐔 Het kippenhok</div>
    <div class="coop-row">
      <div class="coop" id="coopBtn"></div>
      <div class="pasture-frame"><div class="fence-strip fence-top"></div><div class="chicken-yard" id="chickenYard"><div class="empty-msg">Nog geen kippen!</div></div><div class="fence-strip fence-bottom"></div></div>
    </div>
  </div>

  <div class="shed-wrap">
    <div class="section-label">🧰 De gereedschapsschuur</div>
    <div class="shed"></div>
    <div class="tools" id="tools"></div>
  </div>

  <div class="stock-shop-row">

/* ---------- Sound ---------- */
let audioCtx = null;
function beep(freq=440, duration=120, type='sine', vol=0.14){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq; gain.gain.value = vol;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration/1000);
    osc.stop(audioCtx.currentTime + duration/1000);
  }catch(e){}
}
function soundPlow(){ beep(280,160,'sawtooth',0.12); setTimeout(()=>beep(240,160,'sawtooth',0.1),130); }
function soundFertilize(){ beep(700,80,'sine'); setTimeout(()=>beep(850,80,'sine'),80); setTimeout(()=>beep(1000,100,'sine'),160); }
function soundPlant(){ beep(520,90,'triangle'); }

function soundCelebrate(){ [520,660,780,1040].forEach((f,i)=>setTimeout(()=>beep(f,180,'triangle',0.16), i*140)); }

function sweep(f1, f2, duration=300, type='sine', vol=0.15){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(f2,1), audioCtx.currentTime + duration/1000);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration/1000);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration/1000);
  }catch(e){}
}

function soundHorse(){ beep(500,70,'square',0.12); setTimeout(()=>beep(650,70,'square',0.12),80); setTimeout(()=>sweep(700,420,220,'square',0.12),160); }

/* ---------- Day / night cycle ---------- */
const PHASES = ['phase-day','phase-sunset','phase-night','phase-dawn'];
let phaseIndex = 0;
function makeStars(){
  const starsEl = document.getElementById('stars');
  for(let i=0;i<24;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*140 + 'px';
    s.style.opacity = 0.4 + Math.random()*0.6;
    starsEl.appendChild(s);
  }
}
makeStars();
let dayCount = 1;

  phaseIndex = (phaseIndex + 1) % PHASES.length;
  document.body.className = PHASES[phaseIndex];
  if(phaseIndex === 0){ dayCount++; updateLevelUI(); checkLevelUp(); saveGame(); }
}, 20000);

/* ---------- Weather ---------- */
const rainEl = document.getElementById('rain');
let isRaining = false;
function startRain(){
  isRaining = true;
  rainEl.innerHTML = '';
  for(let i=0;i<40;i++){
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = Math.random()*100 + '%';
    d.style.animationDuration = (0.5 + Math.random()*0.4) + 's';
    d.style.animationDelay = (Math.random()*1) + 's';
    rainEl.appendChild(d);
  }
  rainEl.classList.add('active');
  setTimeout(() => { rainEl.classList.remove('active'); isRaining = false; }, 8000);
}
function scheduleRain(){ setTimeout(() => { startRain(); scheduleRain(); }, 25000 + Math.random()*25000); }
scheduleRain();

/* ---------- Celebration ---------- */
function celebrate(message){
  soundCelebrate();
  const conf = document.createElement('div');
  conf.className = 'confetti';
  const colors = ['#ffc93c','#c1443c','#6fa835','#5b8aa6','#e07b39'];
  for(let i=0;i<36;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + '%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*0.4) + 's';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    conf.appendChild(p);
  }
  document.body.appendChild(conf);
  setTimeout(() => conf.remove(), 2800);

  const toast = document.createElement('div');
  toast.className = 'milestone-toast';
  toast.innerHTML = message;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 2600);
}
let level = 1;
const LEVEL_GOALS = [
  { label:'Open de eerste 3 velden', check: () => fieldsUnlocked.slice(0,3).every(Boolean),                        progress: () => fieldsUnlocked.slice(0,3).filter(Boolean).length / 3,                                                          message:'🎉 Level 2! De akker begint vorm te krijgen!', reward:10 },

function levelMultiplier(){ return 1 + (level - 1) * 0.15; }
function cost(base){ return Math.ceil(base * levelMultiplier()); }
function updateLevelUI(){
  document.getElementById('dayCounter').innerHTML = `📅 Dag ${dayCount} · <img class="inline-icon-img" src="${STAR_ICON_IMG}" alt="ster"> Niveau ${level}`;
  const goalEl = document.getElementById('levelGoal');
  const fillEl = document.getElementById('progressFill');
  if(level - 1 < LEVEL_GOALS.length){
    const goal = LEVEL_GOALS[level-1];
    goalEl.textContent = `🎯 ${goal.label}`; goalEl.style.display = '';
    const pct = Math.max(0, Math.min(1, goal.progress ? goal.progress() : 0));
    fillEl.style.width = `calc(${(pct*100).toFixed(0)}% - ${pct>0?16:0}px)`;
    document.getElementById('progressFrame').style.display = '';
  }
  else { goalEl.style.display = 'none'; document.getElementById('progressFrame').style.display = 'none'; }
}
function checkLevelUp(){
  while(level - 1 < LEVEL_GOALS.length && LEVEL_GOALS[level-1].check()){
    const goal = LEVEL_GOALS[level-1];
    level++;
    coins += goal.reward;
    coinCountEl.textContent = coins;
    celebrate(`${goal.message} (+${goal.reward} ${coinIcon()})`);
  }
  updateLevelUI();
  renderTools();
  refreshFieldLockGlow();
  saveGame();
}

/* ---------- Save / load ---------- */
const SAVE_KEY = 'boerderij-timo-save-v2';
function saveGame(){
  try{
    const data = {
      title: document.getElementById('farmTitle').textContent,
      coins, fieldsUnlocked, unlockedCrops:[...unlockedCrops],
      fieldsState: fieldsState.map(s => ({stage:s.stage, cropKey:s.cropKey})),
      inventory, products, eggCount, equipment, animalsOwned, chickensOwned, dayCount, level, animalCapacity, chickenCapacity,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){ /* opslaan niet beschikbaar in deze omgeving */ }
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d.title) document.getElementById('farmTitle').textContent = d.title;
    coins = d.coins ?? coins;
    if(d.fieldsUnlocked) d.fieldsUnlocked.forEach((v,i) => fieldsUnlocked[i] = v);
    if(d.unlockedCrops) d.unlockedCrops.forEach(k => unlockedCrops.add(k));
    if(d.fieldsState) d.fieldsState.forEach((v,i) => {
      if(!v) return;
      // a field that was still growing when the game was closed has no way to know
      // how much time is left, so treat it as finished rather than leaving it stuck
      const stage = v.stage === 'growing' ? (v.cropKey === 'hay' ? 'hay_ready' : 'ready') : (v.stage || 'bare');
      fieldsState[i] = { stage, cropKey:v.cropKey };
    });
    Object.assign(inventory, d.inventory || {});
    Object.assign(products, d.products || {});
    eggCount = d.eggCount || 0;
    Object.assign(equipment, d.equipment || {});
    if(d.dayCount) dayCount = d.dayCount;
    if(d.level) level = d.level;
    if(d.animalCapacity) animalCapacity = d.animalCapacity;
    if(d.chickenCapacity) chickenCapacity = d.chickenCapacity;
    (d.animalsOwned || []).forEach(key => { const a = ANIMALS.find(x => x.key === key); if(a){ addAnimalToPasture(a, true); animalsOwned.push(key); } });
    (d.chickensOwned || []).forEach(() => { addChicken(true); chickensOwned.push(1); });
    return true;
  }catch(e){ return false; }
}

/* ---------- Fields ---------- */
function preloadImage(url){
  return new Promise((resolve) => {
    if(!url){ resolve(); return; }
    const img = new Image();
    img.onload = () => resolve();
    img.onerror = () => resolve();
    img.src = url;
  });
}

// The ground itself only really changes at 3 moments: after plowing, after
// fertilizing, and after harvesting (back to bare). Growing/ready/hay stages
// all sit on the fertilized ground until harvest — so the soil image should
// stay put across those, not flip per stage.
function soilImageForStage(stage){
  switch(stage){
    case 'bare':    return SOIL_BEGIN_IMG;
    case 'plowed':  return SOIL_PLOWED_IMG;
    case 'fertilized':
    case 'growing':
    case 'ready':
    case 'hay_ready':
    case 'hay_cut':
    case 'hay_dried':
      return SOIL_FERTILIZED_IMG;
    default: return SOIL_BEGIN_IMG;
  }
}

function renderFields(){
  const bounceStages = ['ready', 'hay_ready', 'hay_cut', 'hay_dried'];
  fieldsState.forEach((state, i) => {
    let field = fieldsEl.children[i];
    if(!field){
      field = document.createElement('div');
      fieldsEl.appendChild(field);
    }

    const locked = !fieldsUnlocked[i];
    field.className = 'field' + (locked
      ? ' locked' + (coins >= cost(FIELD_COSTS[i]) ? ' affordable-glow' : '')
      : ' stage-' + state.stage + (bounceStages.includes(state.stage) ? ' ready' : ''));
    field.onclick = locked ? (() => tryUnlockField(i)) : (() => onFieldClick(i));

    // --- soil layer: crossfades only when the ground itself actually changes ---
    const soilImg = locked ? null : soilImageForStage(state.stage);
    const soilSig = soilImg || 'none';
    if(field.dataset.soilSig !== soilSig){
      field.dataset.soilSig = soilSig;
      preloadImage(soilImg).then(() => {
        if(field.dataset.soilSig !== soilSig) return; // ground moved on again before this loaded
        const soil = document.createElement('div');
        soil.className = 'field-soil';
        if(soilImg) soil.style.backgroundImage = `url('${soilImg}')`;
        soil.style.opacity = '0';
        const oldSoils = field.querySelectorAll('.field-soil');
        field.insertBefore(soil, field.firstChild);
        requestAnimationFrame(() => requestAnimationFrame(() => { soil.style.opacity = '1'; }));
        setTimeout(() => { oldSoils.forEach(s => s.remove()); }, 400);
      });
    }

    // --- content layer: the icon / caption / crop art / lock on top of the soil ---
    const contentSig = locked
      ? 'locked:' + (coins >= cost(FIELD_COSTS[i]) ? '1' : '0')
      : (state.busy ? 'busy' : state.stage + ':' + (state.cropKey || ''));
    if(field.dataset.contentSig === contentSig) return;
    field.dataset.contentSig = contentSig;

    let html = '', waitUrl = null;
    if(locked){
      html = `<span class="lock"><span class="lockicon">🔒</span><small>${coinIcon()} ${cost(FIELD_COSTS[i])}</small></span>`;
    } else if(state.busy){
      html = ''; // the tractor overlay is added directly by runFieldAction
    } else {
      switch(state.stage){
        case 'bare':       html = `<img class="field-icon-img" src="${TRACTOR_IMG}" alt="tractor" style="transform:scaleX(-1);"><span class="field-caption">Ploegen</span>`; break;
        case 'plowed':     html = `<img class="field-icon-img" src="${COMPOST_PILE_IMG}" alt="mest"><span class="field-caption">Bemesten</span>`; break;
        case 'fertilized': html = `<img class="field-icon-img" src="${SPREADER_IMG}" alt="zaaien"><span class="field-caption">Zaaien</span>`; break;
        case 'growing':    html = '<span class="crop">🌱</span>'; break;
        case 'ready': { const growImg = CROP_GROW_IMAGES[state.cropKey]; const crop = CROP_BY_KEY[state.cropKey];
          html = growImg ? `<img class="field-crop-img" src="${growImg}" alt="${state.cropKey}">` : `<span class="crop">${cropIcon(state.cropKey, crop.em)}</span>`; waitUrl = growImg || null; break; }
        case 'hay_ready':  html = `<img class="field-crop-img" src="${GRASS_GREEN_IMG}" alt="gras"><span class="field-caption">Maaien</span>`; waitUrl = GRASS_GREEN_IMG; break;
        case 'hay_cut':    html = `<img class="field-crop-img" src="${GRASS_GOLD_IMG}" alt="gemaaid gras"><span class="field-caption">Zwadderen</span>`; waitUrl = GRASS_GOLD_IMG; break;
        case 'hay_dried':  html = `<img class="field-crop-img" src="${GRASS_GOLD_IMG}" alt="droog gras"><span class="field-caption">Balen</span>`; waitUrl = GRASS_GOLD_IMG; break;
      }
    }

    preloadImage(waitUrl).then(() => {
      if(field.dataset.contentSig !== contentSig) return; // stage moved on again before this loaded
      field.querySelectorAll('.field-busy').forEach(el => el.remove()); // clear any leftover tractor overlay
      const content = document.createElement('div');
      content.className = 'field-content';
      content.innerHTML = html;
      content.style.opacity = '0';
      const oldContents = field.querySelectorAll('.field-content');
      field.appendChild(content);
      requestAnimationFrame(() => requestAnimationFrame(() => { content.style.opacity = '1'; }));
      setTimeout(() => { oldContents.forEach(c => c.remove()); }, 300);
    });
  });
}

function onFieldClick(i){
  const st = fieldsState[i];
  if(st.busy) return;
  if(st.stage === 'bare') startPlow(i);
  else if(st.stage === 'plowed') startFertilize(i);
  else if(st.stage === 'fertilized'){ activeFieldIndex = i; openCropPicker(); }
  else if(st.stage === 'ready') harvestField(i);
  else if(st.stage === 'hay_ready') startMow(i);
  else if(st.stage === 'hay_cut') startTed(i);
  else if(st.stage === 'hay_dried') startBale(i);
}

function startMow(i){
  runFieldAction(i, 'TRACTOR', 'Maaien...', 3000, soundMow, () => {
    fieldsState[i] = { stage:'hay_cut', cropKey:'hay' };
    renderFields();
    saveGame();
  });
}
function startTed(i){
  runFieldAction(i, 'RAKE', 'Zwadderen...', 3000, soundTed, () => {
    fieldsState[i] = { stage:'hay_dried', cropKey:'hay' };
    renderFields();
    saveGame();
  });
}
function startBale(i){
  runFieldAction(i, 'TRACTOR', 'Balen...', 3000, soundBale, () => {
    inventory['hay'] = (inventory['hay'] || 0) + 1;
    fieldsState[i] = { stage:'bare' };
    renderFields();
    renderStock();
    saveGame();
  });
}

function tryUnlockField(i){
  if(coins >= cost(FIELD_COSTS[i])){
    updateCoins(-cost(FIELD_COSTS[i]));
    fieldsUnlocked[i] = true;
    fieldsState[i] = { stage:'bare' };
    soundUnlock();
    renderFields();
    checkLevelUp();
  }
}

function runFieldAction(i, emoji, caption, duration, sound, onDone){
  fieldsState[i].busy = true;
  const fieldDiv = fieldsEl.children[i];
  fieldDiv.querySelectorAll('.field-content, .field-busy').forEach(el => el.remove());
  const overlay = document.createElement('div');
  overlay.className = 'field-busy';
  const cap = document.createElement('span');
  cap.className = 'field-caption';
  cap.textContent = caption;
  overlay.appendChild(cap);
  const drv = document.createElement('div');
  drv.className = 'tractor';
  if(emoji === 'TRACTOR'){
    drv.innerHTML = `<img class="tractor-img" src="${TRACTOR_IMG}" alt="tractor">`;
  } else if(emoji === 'HARVESTER'){
    drv.innerHTML = `<img class="tractor-img harvester-img" src="${HARVESTER_IMG}" alt="oogstmachine">`;
  } else if(emoji === 'MEST_TRUCK'){
    drv.innerHTML = `<img class="tractor-img compost-img" src="${COMPOST_CART_IMG}" alt="mesttruck">`;
  } else if(emoji === 'RAKE'){
    drv.innerHTML = `<img class="tractor-img" src="${RAKE_IMG}" alt="hooischudder">`;
  } else {
    drv.textContent = emoji;
  }
  drv.style.animationDuration = duration + 'ms';
  overlay.appendChild(drv);
  fieldDiv.appendChild(overlay);
  sound();
  setTimeout(() => { onDone(); }, duration);
}

function startPlow(i){
  const duration = equipment.plow ? PLOW_TIME_FAST : PLOW_TIME_BASE;
  runFieldAction(i, 'TRACTOR', 'Ploegen...', duration, soundPlow, () => {
    fieldsState[i] = { stage:'plowed' };
    renderFields();
    saveGame();
  });
}

function startFertilize(i){
  const duration = equipment.fertilizer ? FERTILIZE_TIME_FAST : FERTILIZE_TIME_BASE;
  runFieldAction(i, 'MEST_TRUCK', 'Bemesten...', duration, soundFertilize, () => {
    fieldsState[i] = { stage:'fertilized' };
    renderFields();
    saveGame();
  });
}

function openCropPicker(){
  cropChoicesEl.innerHTML = '';
  CROPS.forEach(c => {
    const isUnlocked = unlockedCrops.has(c.key);
    const div = document.createElement('div');
    if(c.tier > level){
      div.className = 'choice locked disabled';
      div.innerHTML = `<span class="em">${cropIcon(c.key, c.em)}</span>${c.name}<div class="price">🔒 Level ${c.tier} nodig</div>`;
    } else if(isUnlocked){
      const plantCost = cost(c.plantCost);
      const canAfford = coins >= plantCost;
      div.className = 'choice' + (canAfford ? ' affordable-glow' : ' disabled');
      div.innerHTML = `<span class="em">${cropIcon(c.key, c.em)}</span>${c.name}<div class="price">🌱 ${coinIcon()}${plantCost}</div><div class="price sell">💰 ${coinIcon()}${c.price}</div>`;
      div.addEventListener('click', () => {
        if(coins >= plantCost){
          updateCoins(-plantCost);
          cropOverlay.classList.remove('show');
          plantField(activeFieldIndex, c.key);
        }
      });
    } else {
      const unlockCost = cost(c.unlockCost);
      const canAfford = coins >= unlockCost;
      div.className = 'choice locked' + (canAfford ? ' affordable-glow' : ' disabled');
      div.innerHTML = `<span class="em">${cropIcon(c.key, c.em)}</span>${c.name}<div class="price">🔒 ontgrendel ${coinIcon()} ${unlockCost}</div>`;
      div.addEventListener('click', () => {
        if(coins >= unlockCost){
          updateCoins(-unlockCost);
          unlockedCrops.add(c.key);
          soundUnlock();
          cropOverlay.classList.remove('show');
          plantField(activeFieldIndex, c.key);
          checkLevelUp();
        }
      });
    }
    cropChoicesEl.appendChild(div);
  });
  cropOverlay.classList.add('show');
}
document.getElementById('closeCrop').addEventListener('click', () => cropOverlay.classList.remove('show'));

function plantField(i, cropKey){
  fieldsState[i].busy = true;
  const sowDuration = equipment.sower ? 500 : 1300;
  runFieldAction(i, 'TRACTOR', 'Zaaien...', sowDuration, soundPlant, () => {
    fieldsState[i] = { stage:'growing', cropKey };
    renderFields();
    const crop = CROP_BY_KEY[cropKey];
    let growMs = crop.growMs;
    if(isRaining) growMs *= 0.6;
    if(equipment.sprinkler) growMs *= 0.85;
    setTimeout(() => {
      if(fieldsState[i] && fieldsState[i].stage === 'growing'){
        const readyStage = cropKey === 'hay' ? 'hay_ready' : 'ready';
        fieldsState[i] = { stage:readyStage, cropKey };
        renderFields();
      }
    }, growMs);
    saveGame();
  });
}

function harvestField(i){
  const state = fieldsState[i];
  const crop = CROP_BY_KEY[state.cropKey];
  const yieldCount = equipment.harvester ? 2 : 1;
  fieldsState[i].busy = true;
  runFieldAction(i, 'HARVESTER', 'Oogsten...', 1400, soundHarvest, () => {
    inventory[state.cropKey] = (inventory[state.cropKey] || 0) + yieldCount;
    fieldsState[i] = { stage:'bare' };
    renderFields();
    renderStock();
    saveGame();

    const fieldDiv = fieldsEl.children[i];
    const plusOne = document.createElement('div');
    plusOne.className = 'plusone';
    plusOne.innerHTML = `+${yieldCount} ${harvestIcon(state.cropKey, crop.em)}`;
    fieldDiv.appendChild(plusOne);
    setTimeout(() => plusOne.remove(), 900);
  });
}

/* ---------- Barns / Animals ---------- */
[0].forEach(idx => { document.getElementById('barn'+idx).addEventListener('click', openAnimalPicker); });

function sellOneAnimal(key){
  const a = ANIMALS.find(x => x.key === key);
  const sellPrice = Math.round(cost(a.price) / 2);
  const el = pastureEl.querySelector(`.animal[data-key="${key}"]`);
  if(el) el.remove();
  updateCoins(sellPrice);
  soundSell();
  const idx = animalsOwned.indexOf(key);
  if(idx > -1) animalsOwned.splice(idx, 1);
  ensureEmptyMsg(pastureEl, '.animal', 'Nog geen dieren!');
  saveGame();
}

function renderOwnedAnimals(){
  const wrap = document.getElementById('animalOwnedList');
  wrap.innerHTML = '';
  const counts = {};
  animalsOwned.forEach(k => counts[k] = (counts[k] || 0) + 1);
  const keys = Object.keys(counts);
  if(!keys.length) return;
  const label = document.createElement('div');
  label.className = 'modal-subheading';
  label.textContent = 'Jouw dieren:';
  wrap.appendChild(label);
  keys.forEach(key => {
    const a = ANIMALS.find(x => x.key === key);
    const sellPrice = Math.round(cost(a.price) / 2);
    const row = document.createElement('div');
    row.className = 'sell-row';
    row.innerHTML = `<div class="left"><span class="em">${animalIcon(key, a.em)}</span> ${a.name}: ${counts[key]}</div><button class="sell-btn">Verkoop (${coinIcon()} ${sellPrice})</button>`;
    row.querySelector('.sell-btn').addEventListener('click', () => { sellOneAnimal(key); openAnimalPicker(); });
    wrap.appendChild(row);
  });
}

function openAnimalPicker(){
  renderOwnedAnimals();
  animalChoicesEl.innerHTML = '';
  const currentCount = pastureEl.querySelectorAll('.animal').length;

  const capLabel = document.createElement('div');
  capLabel.className = 'modal-subheading';
  capLabel.style.gridColumn = '1 / -1';
  capLabel.textContent = `🐾 Wei: ${currentCount}/${animalCapacity} plekken`;
  animalChoicesEl.appendChild(capLabel);

  if(animalCapacity < ANIMAL_CAPACITY_MAX){
    const expandCost = pastureExpansionCost();
    const expandRow = document.createElement('div');
    expandRow.className = 'sell-row';
    expandRow.style.gridColumn = '1 / -1';
    expandRow.innerHTML = `<div class="left"><span class="em">🔨</span> Wei uitbreiden (+${ANIMAL_CAPACITY_STEP})</div><button class="sell-btn expand-btn${coins >= expandCost ? ' affordable-glow' : ''}">${coinIcon()} ${expandCost}</button>`;
    const btn = expandRow.querySelector('.expand-btn');
    btn.addEventListener('click', () => {
      if(coins >= expandCost){
        updateCoins(-expandCost);
        animalCapacity += ANIMAL_CAPACITY_STEP;
        soundUnlock();
        openAnimalPicker();
        checkLevelUp();
      }
    });
    animalChoicesEl.appendChild(expandRow);
  }

  if(currentCount >= animalCapacity){
    const full = document.createElement('div');
    full.className = 'empty-shop';
    full.style.gridColumn = '1 / -1';
    full.innerHTML = 'De wei is vol! 🐾<br>Verkoop eerst een dier hierboven, of breid de wei uit.';
    animalChoicesEl.appendChild(full);
    animalOverlay.classList.add('show');
    return;
  }
  const buyLabel = document.createElement('div');
  buyLabel.className = 'modal-subheading';
  buyLabel.style.gridColumn = '1 / -1';
  buyLabel.textContent = 'Nieuw dier kopen:';
  animalChoicesEl.appendChild(buyLabel);
  ANIMALS.forEach(a => {
    const price = cost(a.price);
    const canAfford = coins >= price;
    const div = document.createElement('div');
    div.className = 'choice' + (canAfford ? ' affordable-glow' : ' disabled');
    div.innerHTML = `<span class="em">${animalIcon(a.key, a.em)}</span>${a.name}<div class="price">${coinIcon()} ${price}</div>`;
    div.addEventListener('click', () => {
      if(coins >= price){ updateCoins(-price); soundBuy(); addAnimalToPasture(a); openAnimalPicker(); checkLevelUp(); }
    });
    animalChoicesEl.appendChild(div);
  });
  animalOverlay.classList.add('show');
}
document.getElementById('closeAnimal').addEventListener('click', () => animalOverlay.classList.remove('show'));

function addAnimalToPasture(animal, isLoad){
  const emptyMsg = pastureEl.querySelector('.empty-msg');
  if(emptyMsg) emptyMsg.remove();
  const el = document.createElement('div');
  el.className = 'animal';
  el.innerHTML = animalIcon(animal.key, animal.em);
  el.dataset.key = animal.key;
  const leftPercent = 6 + Math.random() * 46;
  el.style.left = leftPercent + '%';
  el.style.setProperty('--w', (20 + Math.random()*30) + 'px');
  el.style.animationDuration = (4 + Math.random()*3) + 's';
  el.style.animationDelay = (Math.random()*2) + 's';
  pastureEl.appendChild(el);
  if(!isLoad){ animalsOwned.push(animal.key); saveGame(); }
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    if(ANIMAL_SOUNDS[animal.key]) ANIMAL_SOUNDS[animal.key]();
    feedAnimal(el);
  });
}

function feedAnimal(el){
  if((inventory['wheat'] || 0) <= 0) return;
  inventory['wheat'] -= 1;
  updateCoins(1);
  soundCollect();
  const heart = document.createElement('div');
  heart.className = 'heart-pop';
  heart.innerHTML = `<img src="${FEED_HEART_IMG}" alt="hartje" style="width:28px; height:auto;">`;
  heart.style.left = el.style.left;
  pastureEl.appendChild(heart);
  setTimeout(() => heart.remove(), 900);
  renderStock();
  saveGame();
}

/* ---------- Boerderijtijd (periodic milking/shearing popup) ---------- */
const choresOverlay = document.getElementById('choresOverlay');
const choresListEl = document.getElementById('choresList');
function openChoresPopup(){
  if(document.body.classList.contains('phase-night')) return;
  const counts = {};
  animalsOwned.forEach(k => { if(ANIMAL_PRODUCTS[k]) counts[k] = (counts[k] || 0) + 1; });
  const keys = Object.keys(counts);
  if(!keys.length) return; // nothing to collect, skip the interruption entirely
  choresListEl.innerHTML = '';
  keys.forEach(key => {
    const a = ANIMALS.find(x => x.key === key);
    const productDef = ANIMAL_PRODUCTS[key];
    const p = PRODUCT_INFO[productDef.key];
    const actionWord = key === 'cow' ? 'Melken' : 'Scheren';
    const row = document.createElement('div');
    row.className = 'sell-row';
    row.innerHTML = `<div class="left"><span class="em">${animalIcon(key, a.em)}</span> ${counts[key]}x ${a.name}</div><button class="sell-btn affordable-glow">${actionWord} (+${counts[key]} ${productIcon(productDef.key, p.em)})</button>`;
    const btn = row.querySelector('.sell-btn');
    btn.addEventListener('click', () => {
      products[productDef.key] = (products[productDef.key] || 0) + counts[key];
      if(ANIMAL_SOUNDS[key]) ANIMAL_SOUNDS[key]();
      soundCollect();
      renderStock();
      saveGame();
      btn.innerHTML = `<img class="inline-icon-img" src="${CHECK_ICON_IMG}" alt="klaar"> Gedaan!`;
      btn.disabled = true;
      btn.classList.remove('affordable-glow');
    });
    choresListEl.appendChild(row);
  });
  choresOverlay.classList.add('show');
}
function scheduleChores(){
  const delay = 65000 + Math.random() * 30000;
  setTimeout(() => { openChoresPopup(); scheduleChores(); }, delay);
}
scheduleChores();

/* ---------- Kippenhok ---------- */
function sellOneChicken(){
  const el = chickenYardEl.querySelector('.chicken');
  if(el) el.remove();
  const sellPrice = Math.round(cost(CHICKEN_PRICE) / 2);
  updateCoins(sellPrice);
  soundSell();
  if(chickensOwned.length) chickensOwned.pop();
  ensureEmptyMsg(chickenYardEl, '.chicken', 'Nog geen kippen!');
  saveGame();
}

function renderOwnedChickens(){
  const wrap = document.getElementById('coopOwnedList');
  wrap.innerHTML = '';
  const count = chickenYardEl.querySelectorAll('.chicken').length;
  if(!count) return;
  const label = document.createElement('div');
  label.className = 'modal-subheading';
  label.textContent = 'Jouw kippen:';
  wrap.appendChild(label);
  const sellPrice = Math.round(cost(CHICKEN_PRICE) / 2);
  const row = document.createElement('div');
  row.className = 'sell-row';
  row.innerHTML = `<div class="left"><span class="em"><img class="inline-icon-img" src="${CHICKEN_IMG}" alt="kip"></span> Kip: ${count}</div><button class="sell-btn">Verkoop (${coinIcon()} ${sellPrice})</button>`;
  row.querySelector('.sell-btn').addEventListener('click', () => { sellOneChicken(); openCoopPicker(); });
  wrap.appendChild(row);
}

function openCoopPicker(){
  renderOwnedChickens();
  coopChoicesEl.innerHTML = '';
  const currentCount = chickenYardEl.querySelectorAll('.chicken').length;

  const capLabel = document.createElement('div');
  capLabel.className = 'modal-subheading';
  capLabel.style.gridColumn = '1 / -1';
  capLabel.textContent = `🐔 Ren: ${currentCount}/${chickenCapacity} plekken`;
  coopChoicesEl.appendChild(capLabel);

  if(chickenCapacity < CHICKEN_CAPACITY_MAX){
    const expandCost = coopExpansionCost();
    const expandRow = document.createElement('div');
    expandRow.className = 'sell-row';
    expandRow.style.gridColumn = '1 / -1';
    expandRow.innerHTML = `<div class="left"><span class="em">🔨</span> Ren uitbreiden (+${CHICKEN_CAPACITY_STEP})</div><button class="sell-btn expand-btn${coins >= expandCost ? ' affordable-glow' : ''}">${coinIcon()} ${expandCost}</button>`;
    const btn = expandRow.querySelector('.expand-btn');
    btn.addEventListener('click', () => {
      if(coins >= expandCost){
        updateCoins(-expandCost);
        chickenCapacity += CHICKEN_CAPACITY_STEP;
        soundUnlock();
        openCoopPicker();
        checkLevelUp();
      }
    });
    coopChoicesEl.appendChild(expandRow);
  }

  if(currentCount >= chickenCapacity){
    const full = document.createElement('div');
    full.className = 'empty-shop';
    full.style.gridColumn = '1 / -1';
    full.innerHTML = 'Het ren is vol! 🐔<br>Verkoop eerst een kip hierboven, of breid het ren uit.';
    coopChoicesEl.appendChild(full);
    coopOverlay.classList.add('show');
    return;
  }
  const buyLabel = document.createElement('div');
  buyLabel.className = 'modal-subheading';
  buyLabel.style.gridColumn = '1 / -1';
  buyLabel.textContent = 'Nieuwe kip kopen:';
  coopChoicesEl.appendChild(buyLabel);
  const div = document.createElement('div');
  const chickenPrice = cost(CHICKEN_PRICE);
  div.className = 'choice' + (coins >= chickenPrice ? ' affordable-glow' : ' disabled');
  div.innerHTML = `<span class="em"><img class="inline-icon-img" src="${CHICKEN_IMG}" alt="kip"></span>Kip<div class="price">${coinIcon()} ${chickenPrice}</div>`;
  div.addEventListener('click', () => {
    if(coins >= chickenPrice){ updateCoins(-chickenPrice); soundBuy(); addChicken(); openCoopPicker(); checkLevelUp(); }
  });
  coopChoicesEl.appendChild(div);
  coopOverlay.classList.add('show');
}
document.getElementById('coopBtn').addEventListener('click', openCoopPicker);
document.getElementById('closeCoop').addEventListener('click', () => coopOverlay.classList.remove('show'));

function addChicken(isLoad){
  const emptyMsg = chickenYardEl.querySelector('.empty-msg');
  if(emptyMsg) emptyMsg.remove();
  const el = document.createElement('div');
  el.className = 'chicken';
  el.innerHTML = `<img class="inline-icon-img" src="${CHICKEN_IMG}" alt="kip" style="width:42px; transform:scaleX(-1);">`;
  const left = 6 + Math.random() * 46;
  el.style.left = left + '%';
  el.style.setProperty('--w', (15 + Math.random()*20) + 'px');
  el.style.animationDuration = (5 + Math.random()*3) + 's';
  el.style.animationDelay = (Math.random()*2) + 's';
  chickenYardEl.appendChild(el);
  if(!isLoad){ chickensOwned.push(1); saveGame(); }
  el.addEventListener('click', (e) => { e.stopPropagation(); soundChicken(); });
  scheduleEgg(el, left);
}

function scheduleEgg(chickenEl, leftPercent){
  const delay = 10000 + Math.random() * 9000;
  setTimeout(() => {
    if(!chickenEl.isConnected) return;
    if(document.body.classList.contains('phase-night')){ scheduleEgg(chickenEl, leftPercent); return; }
    const egg = document.createElement('div');
    egg.className = 'product';
    egg.innerHTML = `<img src="${EGG_IMG}" alt="ei" style="width:30px; height:auto; display:block;">`;
    egg.style.left = (5 + Math.random() * 84) + '%';
    egg.style.bottom = (6 + Math.random() * 30) + 'px';
    egg.addEventListener('click', () => { eggCount += 1; soundCollect(); egg.remove(); renderStock(); saveGame(); });
    chickenYardEl.appendChild(egg);
    scheduleEgg(chickenEl, leftPercent);
  }, delay);
}

/* ---------- Gereedschapsschuur ---------- */
function renderTools(){
  toolsEl.innerHTML = '';
  TOOLS.forEach(t => {
    const owned = equipment[t.key];
    const price = cost(t.price);
    const canAfford = coins >= price;
    const div = document.createElement('div');
    div.className = 'tool-card' + (owned ? ' owned' : (canAfford ? ' affordable-glow' : ' disabled'));
    const TOOL_IMAGES = { plow: TRACTOR_IMG, harvester: HARVESTER_IMG, sprinkler: SPRINKLER_IMG };
    const iconHtml = t.key === 'plow'
      ? `<img class="tool-icon-img" src="${TRACTOR_IMG}" alt="tractor" style="transform:scaleX(-1);">`
      : TOOL_IMAGES[t.key]
        ? `<img class="tool-icon-img" src="${TOOL_IMAGES[t.key]}" alt="${t.key}">`
        : `<span class="em">${t.em}</span>`;
    div.innerHTML = `${iconHtml}${t.name}<div class="price">${owned ? `Gekocht <img class="inline-icon-img" src="${CHECK_ICON_IMG}" alt="gekocht">` : coinIcon() + ' ' + price}</div><div class="desc">${t.desc}</div>`;
    if(!owned){
      div.addEventListener('click', () => {
        if(coins >= price){ updateCoins(-price); equipment[t.key] = true; soundUnlock(); renderTools(); checkLevelUp(); }
      });
    }
    toolsEl.appendChild(div);
  });
}

const stockTableEl = document.getElementById('stockTable');
function renderStock(){
  stockTableEl.innerHTML = '';
  const rows = [];
  CROPS.forEach(c => { if(inventory[c.key] > 0) rows.push({key:c.key, em:c.em, name:c.name, count:inventory[c.key]}); });
  Object.keys(PRODUCT_INFO).forEach(key => { if(products[key] > 0){ const p = PRODUCT_INFO[key]; rows.push({key:key, em:p.em, name:p.name, count:products[key]}); } });
  if(eggCount > 0) rows.push({key:'egg', em:'🥚', name:'Eieren', count:eggCount});
  if(!rows.length){ stockTableEl.innerHTML = '<div class="stock-empty">Nog niks geoogst of verzameld.</div>'; return; }
  rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'stock-row';
    row.innerHTML = `<span><span class="em">${harvestIcon(r.key, r.em)}</span>${r.name}</span><span>${r.count}</span>`;
    stockTableEl.appendChild(row);
  });
}

/* ---------- Shop ---------- */
document.getElementById('shopBtn').addEventListener('click', () => { renderShop(); shopOverlay.classList.add('show'); });
document.getElementById('closeShop').addEventListener('click', () => shopOverlay.classList.remove('show'));
document.getElementById('closeChores').addEventListener('click', () => choresOverlay.classList.remove('show'));

function renderShop(){
  shopListEl.innerHTML = '';
  const items = [];
  CROPS.forEach(c => {
    if(inventory[c.key] > 0){
      const price = c.price + (equipment.fertilizer ? 1 : 0);
      items.push({key:c.key, em:c.em, name:c.name, count:inventory[c.key], price, sell:() => { inventory[c.key]--; updateCoins(price); soundSell(); renderShop(); renderStock(); }});
    }
  });
  Object.keys(PRODUCT_INFO).forEach(key => {
    if(products[key] > 0){
      const p = PRODUCT_INFO[key];
      items.push({key:key, em:p.em, name:p.name, count:products[key], price:p.price, sell:() => { products[key]--; updateCoins(p.price); soundSell(); renderShop(); renderStock(); }});
    }
  });
  if(eggCount > 0) items.push({key:'egg', em:'🥚', name:'Eieren', count:eggCount, price:EGG_PRICE, sell:() => { eggCount--; updateCoins(EGG_PRICE); soundSell(); renderShop(); renderStock(); }});

  if(items.length === 0){
    shopListEl.innerHTML = '<div class="empty-shop">Je hebt nog niks te verkopen.<br>Ga oogsten of dieren verzorgen! 🌽🥚</div>';
    return;
  }
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'sell-row';
    row.innerHTML = `<div class="left"><span class="em">${harvestIcon(item.key, item.em)}</span> ${item.name}: ${item.count}</div><button class="sell-btn">Verkoop (${coinIcon()} ${item.price})</button>`;
    row.querySelector('.sell-btn').addEventListener('click', item.sell);
    shopListEl.appendChild(row);
  });
}

/* ---------- Clouds ---------- */
function makeClouds(){
  const positions = [ [8,'8%','46px'], [55,'40%','64px'], [80,'12%','40px'] ];
  const img = new Image();
  img.onload = () => {
    const ratio = img.naturalWidth / img.naturalHeight || 2.6;
    positions.forEach(([top, left, size]) => {
      const c = document.createElement('div');
      c.className = 'cloud';
      c.style.top = top + 'px';
      c.style.left = left;
      const h = parseInt(size);
      c.style.height = h + 'px';
      c.style.width = (h * ratio) + 'px';
      c.style.background = `url('${CLOUD_IMG}') 0 0/contain no-repeat`;
      document.getElementById('hero').appendChild(c);
    });
  };
  img.src = CLOUD_IMG;
}
makeClouds();

function setBannerImage(el, src, fallbackBg){
  const img = new Image();
  img.onload = () => { el.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`; el.style.backgroundImage = `url('${src}')`; };
  img.onerror = () => { if(fallbackBg) el.style.background = fallbackBg; };
  img.src = src;
}
